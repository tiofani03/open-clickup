name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://clickuppp:clickuppp@localhost:5544/clickuppp?sslmode=disable

jobs:
  build:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clickuppp
          POSTGRES_PASSWORD: clickuppp
          POSTGRES_DB: clickuppp
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U clickuppp"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: server-go/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: go run ./cmd/migrate
        working-directory: server-go
      - run: go test ./...
        working-directory: server-go
      - run: pnpm lint
      - run: npx tsc --noEmit
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clickuppp
          POSTGRES_PASSWORD: clickuppp
          POSTGRES_DB: clickuppp
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U clickuppp"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: server-go/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: go run ./cmd/migrate
        working-directory: server-go
      - run: go run ./cmd/seed
        working-directory: server-go
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
        env:
          CI: "true"
