# One-command self-host: `docker compose -f docker-compose.prod.yml up --build`
# App on http://localhost:3000. Seed demo data (optional):
#   docker compose -f docker-compose.prod.yml exec app pnpm db:seed
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clickuppp
      POSTGRES_PASSWORD: clickuppp
      POSTGRES_DB: clickuppp
    volumes:
      - clickuppp-prod-data:/var/lib/postgresql/data
    ports:
      - "5544:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clickuppp"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: runner
      network: host
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://clickuppp:clickuppp@db:5432/clickuppp?sslmode=disable
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - clickuppp-uploads:/app/data/uploads
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  clickuppp-prod-data:
  clickuppp-uploads:

